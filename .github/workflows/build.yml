name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: ZIP entpacken
        run: |
          shopt -s nullglob
          for z in *.zip; do echo "Entpacke $z"; unzip -q -o "$z" -d _proj; done
      - name: Projekt und Bibeln pruefen
        run: |
          f=$(find _proj . -name settings.gradle 2>/dev/null | head -n 1)
          if [ -z "$f" ]; then
            echo "FEHLER: settings.gradle nicht gefunden. Dateien im Repository:"
            ls -R | head -n 80
            exit 1
          fi
          d=$(dirname "$f"); echo "$d" > .projdir
          for b in schlachter riveduta bsb; do
            file="$d/app/src/main/assets/bibles/$b.json"
            if [ ! -s "$file" ] || [ "$(stat -c %s "$file")" -lt 3000000 ]; then
              echo "FEHLER: Bibel fehlt oder unvollstaendig: $b"; exit 1
            fi
            echo "OK  $b  $(stat -c %s "$file") Bytes"
          done
      - name: APK bauen
        run: |
          cd "$(cat .projdir)"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MinimalistBible-APK
          path: "**/app-debug.apk"
